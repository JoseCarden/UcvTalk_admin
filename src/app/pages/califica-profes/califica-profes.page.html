<ion-content [fullscreen]="true" style="--background: red;">
  <ion-header>
    <ion-toolbar class="custom-toolbar">
      <ion-buttons slot="start">
        <ion-button (click)="regresar()">
          <ion-icon name="arrow-back"></ion-icon>
        </ion-button>
      </ion-buttons>
      <ion-title class="bold-title">Calificación Profesionales</ion-title>
    </ion-toolbar>
  </ion-header>
  
  <h1 class="title">GRÁFICO</h1>
  
  <div id="contenedorGraficoDeTarta" class="chart-container">
    <canvas id="graficoDeTarta"></canvas>
  </div>
  
  <ion-button class="imprimir-button" expand="full" (click)="imprimir()">IMPRIMIR</ion-button>
</ion-content>
