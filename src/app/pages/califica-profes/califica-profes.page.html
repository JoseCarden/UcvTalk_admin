<ion-content [fullscreen]="true">
  <ion-header>
    <ion-toolbar class="custom-toolbar">
      <ion-buttons slot="start">
        <ion-button (click)="goBack()">
          <ion-icon name="arrow-back"></ion-icon>
        </ion-button>
      </ion-buttons>
      <ion-title class="bold-title">Calificacion Profesionales</ion-title>
    </ion-toolbar>
  </ion-header>
  <h1 class="title">GRAFICO</h1>
  <div id="myPieChartContainer" class="chart-container">
    <canvas id="myPieChart"></canvas>
  </div>
  <ion-button class="imprimir-button" expand="full" (click)="imprimir()">IMPRIMIR</ion-button>
</ion-content>
